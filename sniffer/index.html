<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TG Theme Sniffer</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font: 14px/1.4 system-ui, -apple-system, Roboto, sans-serif;
        background: var(--tg-theme-secondary-bg-color, #efeff4);
        color: var(--tg-theme-text-color, #000);
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      .hint {
        color: var(--tg-theme-hint-color, #8e8e93);
        font-size: 13px;
      }
      .section {
        background: var(--tg-theme-section-bg-color, #fff);
        border-radius: 12px;
        padding: 12px;
        margin: 12px 0;
      }
      .section h2 {
        margin: 0 0 8px;
        font-size: 13px;
        text-transform: uppercase;
        color: var(--tg-theme-section-header-text-color, #6d6d72);
      }
      .grid {
        display: grid;
        grid-template-columns: 28px 1fr auto;
        gap: 6px 10px;
        align-items: center;
        font-size: 13px;
      }
      .sw {
        width: 28px;
        height: 20px;
        border-radius: 5px;
        box-shadow: inset 0 0 0 1px rgba(127, 127, 127, 0.35);
      }
      code,
      pre {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 12px;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-all;
        margin: 0;
      }
      label {
        display: block;
        margin: 6px 0;
      }
      input {
        font: inherit;
        width: 100%;
        padding: 6px 8px;
        border-radius: 8px;
        border: 1px solid var(--tg-theme-section-separator-color, #c8c7cc);
        background: var(--tg-theme-bg-color, #fff);
        color: inherit;
      }
      .warn {
        color: var(--tg-theme-destructive-text-color, #ff3b30);
      }
    </style>
  </head>
  <body>
    <h1>TG Theme Sniffer</h1>
    <div class="hint">Captures themeParams for TG Native Kit presets. Tap the main button to copy.</div>
    <div id="out"></div>

    <script>
      const tg = window.Telegram && window.Telegram.WebApp;
      const out = document.getElementById('out');

      const KEYS = [
        'bg_color', 'secondary_bg_color', 'header_bg_color', 'bottom_bar_bg_color', 'section_bg_color',
        'section_separator_color', 'text_color', 'accent_text_color', 'section_header_text_color',
        'subtitle_text_color', 'destructive_text_color', 'hint_color', 'link_color', 'button_color',
        'button_text_color',
      ];
      const PLATFORM = { ios: 'ios', android: 'android', android_x: 'android', tdesktop: 'desktop', macos: 'desktop', weba: 'desktop', webk: 'desktop' };
      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

      let note = localStorage.getItem('sniffer-note') || '';

      function preset() {
        const platform = PLATFORM[tg.platform] || 'desktop';
        const scheme = tg.colorScheme;
        return {
          id: `${platform}-${scheme}`,
          name: `${platform === 'ios' ? 'iOS' : platform[0].toUpperCase() + platform.slice(1)} ${scheme[0].toUpperCase() + scheme.slice(1)}`,
          platform,
          scheme,
          source: `sniffer · ${tg.platform} · Bot API ${tg.version}${note ? ' · ' + note : ''} · ${new Date().toISOString().slice(0, 10)}`,
          params: Object.fromEntries(KEYS.filter((k) => tg.themeParams[k]).map((k) => [k, tg.themeParams[k].toLowerCase()])),
        };
      }

      function render() {
        if (!tg || !tg.initData && tg.platform === 'unknown') {
          out.innerHTML = '<div class="section warn">Open this page as a Telegram Mini App (via a bot), not in a browser.</div>';
          return;
        }
        const tp = tg.themeParams;
        const missing = KEYS.filter((k) => !tp[k]);
        const extra = Object.keys(tp).filter((k) => !KEYS.includes(k));
        const sa = tg.safeAreaInset || {};
        const csa = tg.contentSafeAreaInset || {};
        out.innerHTML = `
          <div class="section">
            <h2>Client</h2>
            <div>platform: <code>${esc(tg.platform)}</code> · Bot API <code>${esc(tg.version)}</code> · scheme <code>${esc(tg.colorScheme)}</code></div>
            <div>viewport: <code>${Math.round(tg.viewportHeight)}</code> / stable <code>${Math.round(tg.viewportStableHeight)}</code> · expanded <code>${tg.isExpanded}</code> · fullscreen <code>${!!tg.isFullscreen}</code></div>
            <div>safeArea: <code>${esc(JSON.stringify(sa))}</code></div>
            <div>contentSafeArea: <code>${esc(JSON.stringify(csa))}</code></div>
            <label>Note (client version, custom theme name…)<input id="note" value="${esc(note)}" placeholder="e.g. Telegram iOS 12.1, Day theme" /></label>
          </div>
          <div class="section">
            <h2>themeParams</h2>
            <div class="grid">
              ${KEYS.map((k) => `<span class="sw" style="background:${esc(tp[k] || 'transparent')}"></span><code>${k}</code><code>${tp[k] ? esc(tp[k]) : '<span class="warn">missing</span>'}</code>`).join('')}
            </div>
            ${missing.length ? `<p class="warn">Missing: ${missing.join(', ')}</p>` : ''}
            ${extra.length ? `<p class="warn">New keys not in the plugin yet: ${esc(extra.join(', '))} — update src/core/theme-params.ts</p>` : ''}
          </div>
          <div class="section">
            <h2>Preset JSON</h2>
            <pre id="json">${esc(JSON.stringify(preset(), null, 2))}</pre>
          </div>`;
        document.getElementById('note').oninput = (e) => {
          note = e.target.value;
          localStorage.setItem('sniffer-note', note);
          document.getElementById('json').textContent = JSON.stringify(preset(), null, 2);
        };
      }

      async function copy() {
        const text = JSON.stringify(preset(), null, 2);
        try {
          await navigator.clipboard.writeText(text);
          tg.showAlert('Preset JSON copied');
        } catch {
          // Clipboard is blocked in some clients — select the text instead.
          const r = document.createRange();
          r.selectNodeContents(document.getElementById('json'));
          getSelection().removeAllRanges();
          getSelection().addRange(r);
          tg.showAlert('Copy is blocked here — the JSON is selected, copy it manually.');
        }
      }

      if (tg) {
        tg.ready();
        tg.expand();
        tg.MainButton.setParams({ text: 'Copy preset JSON', is_visible: true });
        tg.MainButton.onClick(copy);
        ['themeChanged', 'viewportChanged', 'safeAreaChanged', 'contentSafeAreaChanged', 'fullscreenChanged'].forEach((e) => tg.onEvent(e, render));
      }
      render();
    </script>
  </body>
</html>
